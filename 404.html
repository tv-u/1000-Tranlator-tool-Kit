<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Translator Kit</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages with repository subpath support
      // pathSegmentsToKeep = 1 preserves the repository name segment (e.g. /1000-Tranlator-tool-Kit/)
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var pathSegments = l.pathname.split('/').slice(1);
      
      // If hosted at root or subpath
      var repoPrefix = pathSegmentsToKeep > 0 ? '/' + pathSegments.slice(0, pathSegmentsToKeep).join('/') : '';
      var routePath = '/' + pathSegments.slice(pathSegmentsToKeep).join('/');

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoPrefix + '/?p=' + encodeURIComponent(routePath) +
        (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
